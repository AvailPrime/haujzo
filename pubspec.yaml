name: truck_booking
description: "A Truck Booking and Freight Logistics Flutter App."
publish_to: 'none'

version: 1.0.2+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Core State Management & Navigation
  get: ^4.6.6
  get_storage: ^2.1.1

  # Firebase Suite
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.2
  firebase_database: ^11.3.1
  firebase_storage: ^12.4.1
  cloud_functions: ^5.2.1
  firebase_messaging: ^15.2.1

  # Authentication & Social
  google_sign_in: 6.3.0

  # UI Components & Icons
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  readmore: ^3.0.0

  # Utilities & Services
  http: ^1.2.1
  intl: ^0.19.0
  url_launcher: ^6.2.5
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  app_links: ^6.0.1
  share_plus: ^10.1.3
  image_picker: ^1.1.1
  file_picker: ^8.0.7

  flutter_native_splash: ^2.4.0
  flutter_local_notifications: ^17.1.2
  logger: ^2.4.0

  # Maps & Location
  geolocator: ^12.0.0
  google_maps_flutter: ^2.7.0
  flutter_polyline_points: ^2.1.0

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # WebView & Audio Alerts
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.1
  audioplayers: ^6.6.0
  record: ^6.2.1
  firebase_app_check: ^0.3.2+10
  firebase_crashlytics: ^4.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# Native Splash Screen Configuration
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#1F1F1F"
  image: assets/logos/launch_logo.png
  image_dark: assets/logos/launch_logo.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#1F1F1F"
    image: assets/logos/launch_logo.png
    image_dark: assets/logos/launch_logo.png
  android: true
  ios: true
  web: false

# App Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logos/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/on_boarding_images/
    - assets/images/verify_email_images/
    - assets/images/banners/
    - assets/images/user/
    - assets/images/payment/
    - assets/animations/
