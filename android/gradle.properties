org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
android.enableJetifier=true

# Disable incremental compilation to fix "different roots" errors when project is on a different drive (D:) than Pub cache (C:)
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false

# Windows cross-drive build fix
android.overridePathCheck=true
org.gradle.caching=false
org.gradle.workers.max=2
android.enableR8.fullMode=true
